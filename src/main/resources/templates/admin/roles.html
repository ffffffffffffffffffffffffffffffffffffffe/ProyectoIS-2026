<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Gestionar roles</title>
</head>
<body>
<header class="barra">
    <a class="marca" th:href="@{/}">Prácticas pedagógicas</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="boton-secundario">
            Cerrar sesión
        </button>
    </form>
</header>
<main class="contenedor tarjeta">
    <h1>Gestionar roles de usuario</h1>
    <p>
        <a th:href="@{/admin/usuarios/nuevo}">Crear usuario</a>
    </p>

    <p th:if="${mensaje}"
       th:text="${mensaje}"
       role="status"></p>

    <p th:if="${error}"
       th:text="${error}"
       role="alert"></p>

    <p th:if="${#lists.isEmpty(usuarios)}">
        No hay usuarios registrados.
    </p>

    <form th:unless="${#lists.isEmpty(usuarios)}"
          th:action="@{/admin/roles}"
          method="post">

        <p>
            <label for="usuarioId">Usuario</label>
            <select id="usuarioId" name="usuarioId" required>
                <option value="" disabled selected>
                    Selecciona un usuario
                </option>

                <option th:each="usuario : ${usuarios}"
                        th:value="${usuario.id}"
                        th:text="|${usuario.nombre} (${usuario.correo})|">
                </option>
            </select>
        </p>

        <p>
            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
                <option value="" disabled selected>
                    Selecciona un rol
                </option>

                <option th:each="rol : ${roles}"
                        th:value="${rol}"
                        th:text="${rol}">
                </option>
            </select>
        </p>

        <button type="submit" name="accion" value="asignar">
            Asignar rol
        </button>

        <button type="submit" name="accion" value="quitar">
            Quitar rol
        </button>
    </form>

    <hr>

</main>
</body>
</html>
