<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablecer contraseña | Prácticas pedagógicas</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/usuario-password.js}" defer></script>
</head>
<body>
<header th:replace="~{fragmentos/barra :: barra}"></header>

<main class="contenedor">
    <section class="tarjeta tarjeta-password">
        <span class="etiqueta">Administración</span>
        <h1>Restablecer contraseña</h1>

        <p>
            Usuario:
            <strong th:text="${nombreMiembro}"></strong>
        </p>
        <p class="texto-secundario cuenta"
           th:text="${correoMiembro}">
        </p>

        <p class="texto-secundario">
            Establece una contraseña nueva de al menos 8 caracteres.
            Al guardar, se cerrarán las sesiones del usuario
            cuando vuelva a utilizar la plataforma.
        </p>

        <p th:if="${error}"
           class="aviso error"
           role="alert"
           th:text="${error}">
        </p>

        <form th:action="@{/admin/usuarios/{id}/password(id=${usuarioId})}"
              method="post">

            <div class="campo">
                <label for="nuevaPassword">Contraseña nueva</label>
                <input id="nuevaPassword"
                       name="nuevaPassword"
                       type="password"
                       autocomplete="new-password"
                       minlength="8"
                       maxlength="72"
                       required>
            </div>

            <div class="campo">
                <label for="confirmacion">Confirmar contraseña</label>
                <input id="confirmacion"
                       name="confirmacion"
                       type="password"
                       autocomplete="new-password"
                       minlength="8"
                       maxlength="72"
                       required>
            </div>

            <button type="button"
                    id="mostrar-password"
                    class="boton-secundario"
                    aria-controls="nuevaPassword confirmacion"
                    aria-pressed="false"
                    style="width: auto; min-width: 0; min-height: 0;
               padding: 3px 7px; font-size: 11px;
               line-height: 1.2; border-radius: 5px;">
                Mostrar contraseñas
            </button>

            <div style="display: flex; align-items: center;
            justify-content: space-between;
            gap: 12px; margin-top: 22px;">

                <button type="submit"
                        style="width: auto; min-width: 0; min-height: 0;
                   padding: 4px 9px; font-size: 11px;
                   line-height: 1.2; border-radius: 5px;">
                    Guardar contraseña
                </button>

                <a class="boton boton-secundario"
                   th:href="@{/admin/usuarios}"
                   style="width: auto; min-width: 0; margin-left: auto;
              padding: 4px 9px; font-size: 11px;
              line-height: 1.2; border-radius: 5px;">
                    Cancelar
                </a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
