<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar | Prácticas pedagógicas</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<main class="login-contenedor">
    <section class="tarjeta login-tarjeta">
        <span class="etiqueta">Prácticas pedagógicas</span>
        <h1>Ingresa a tu cuenta</h1>
        <p class="texto-secundario">
            Accede a la plataforma con tu correo y contraseña.
        </p>

        <p th:if="${param.error}" class="aviso error" role="alert">
            No pudimos iniciar sesión. Revisa tu correo y contraseña.
        </p>

        <p th:if="${param.logout}" class="aviso exito" role="status">
            Cerraste sesión. Puedes ingresar con otra cuenta.
        </p>

        <p th:if="${param.expired}" class="aviso" role="status">
            Tu sesión expiró. Ingresa nuevamente para continuar.
        </p>

        <form th:action="@{/login}" method="post">
            <div class="campo">
                <label for="username">Correo electrónico</label>
                <input id="username"
                       name="username"
                       type="email"
                       autocomplete="username"
                       placeholder="nombre@ejemplo.com"
                       required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="ancho-completo">
                Iniciar sesión
            </button>
        </form>
    </section>
</main>
</body>
</html>
